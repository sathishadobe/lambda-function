name: Deploy to Production Lambdas

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Debug - show repo structure
      - name: List files
        run: |
          echo "[INFO] Repository structure:"
          ls -R

      # 3. Install jq (for JSON parsing)
      - name: Install jq
        run: |
          echo "[INFO] Installing jq..."
          sudo apt-get install -y jq

      # 4. Configure AWS credentials
      # IAM user (long-term) keys: access key + secret + region only — do NOT set
      # AWS_SESSION_TOKEN in GitHub (or remove it if present). A wrong/empty session
      # token causes: "The security token included in the request is invalid."
      # Temporary creds only: add aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} below.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # 5. Verify AWS identity
      - name: Verify AWS Identity
        run: |
          echo "[INFO] Verifying AWS identity..."
          aws sts get-caller-identity

      # 6. Deploy Lambdas using mapping file
      # Same secret NAMES as staging — values from GitHub Environment "production".
      # Add each variable name to lambda-env-mapping.json "variables" + matching env line below.
      - name: Deploy Lambdas
        env:
          COMMERCE_BASE_URL: ${{ secrets.COMMERCE_BASE_URL }}
          COMMERCE_CONSUMER_KEY: ${{ secrets.COMMERCE_CONSUMER_KEY }}
          COMMERCE_CONSUMER_SECRET: ${{ secrets.COMMERCE_CONSUMER_SECRET }}
          COMMERCE_ACCESS_TOKEN: ${{ secrets.COMMERCE_ACCESS_TOKEN }}
          COMMERCE_ACCESS_TOKEN_SECRET: ${{ secrets.COMMERCE_ACCESS_TOKEN_SECRET }}
          COMMERCE_OFFLINE_BOOKING_CANCEL_PATH: ${{ secrets.COMMERCE_OFFLINE_BOOKING_CANCEL_PATH }}
          DMS_TOKEN_URL: ${{ secrets.DMS_TOKEN_URL }}
          DMS_CLIENT_ID: ${{ secrets.DMS_CLIENT_ID }}
          DMS_CLIENT_SECRET: ${{ secrets.DMS_CLIENT_SECRET }}
          DMS_BOOKED_CARS_API_URL: ${{ secrets.DMS_BOOKED_CARS_API_URL }}
          DMS_X_API_KEY: ${{ secrets.DMS_X_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -e

          ENV="prod"
          echo "[INFO] Using environment: $ENV"

          echo "[INFO] Building Lambda environment (production GitHub Environment → Lambda keys)..."
          bash scripts/build-lambda-environment.sh production > /tmp/lambda-env.json
          echo "[INFO] Lambda env keys (non-empty):"
          jq '.Variables | keys' /tmp/lambda-env.json
          if [ "$(jq '.Variables | length' /tmp/lambda-env.json)" -eq 0 ]; then
            echo "::error::No production secrets resolved — add COMMERCE_* secrets and env block in deploy-prod.yml"
            exit 1
          fi

          # Loop through mapping file (skip JSON-only keys like _comment)
          for FOLDER in $(jq -r 'keys[] | select(. != "_comment")' lambda-map.json); do

            BASE_NAME=$(jq -r --arg key "$FOLDER" '.[$key]' lambda-map.json)
            FUNCTION_NAME="${BASE_NAME}"

            echo "------------------------------------"
            echo "[INFO] Folder        : $FOLDER"
            echo "[INFO] Base Lambda   : $BASE_NAME"
            echo "[INFO] Final Lambda  : $FUNCTION_NAME"
            echo "------------------------------------"

            # -------------------------------
            # 📦 Zip Lambda
            # -------------------------------
            echo "[INFO] Zipping code for $FOLDER..."
            cd "src/$FOLDER"
            if [ -f package.json ]; then
              echo "[INFO] npm ci (production deps)..."
              npm ci --omit=dev
            fi
            zip -r "../../$FOLDER.zip" . > /dev/null
            cd -

            ls -la "$FOLDER.zip"

            # Env first, then code — avoids ResourceConflict after code update, and we cannot use
            # `aws lambda wait function-updated` (requires lambda:GetFunctionConfiguration).
            # -------------------------------
            # 🔐 Update environment variables (from secrets → lambda-env-mapping.json)
            # -------------------------------
            echo "[INFO] Updating environment variables..."
            jq -n --arg fn "$FUNCTION_NAME" --argjson env "$(cat /tmp/lambda-env.json)" \
              '{FunctionName: $fn, Environment: $env}' > /tmp/cli-input.json
            aws lambda update-function-configuration --cli-input-json file:///tmp/cli-input.json

            echo "[SUCCESS] Environment updated for $FUNCTION_NAME"

            # -------------------------------
            # 🚀 Update Lambda code
            # -------------------------------
            echo "[INFO] Updating Lambda code..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "fileb://$FOLDER.zip" > /dev/null

            echo "[SUCCESS] Code updated for $FUNCTION_NAME"

            echo "[SUCCESS] Deployment complete for $FUNCTION_NAME"
          done

      # 7. Attach New Relic Lambda Extension layer + env vars to logforwarding
      - name: Configure New Relic on logforwarding
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_LAMBDA_HANDLER: ${{ secrets.NEW_RELIC_LAMBDA_HANDLER }}
        run: |
          echo "[INFO] Fetching current environment for logforwarding..."
          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name logforwarding \
            --query 'Environment.Variables' --output json 2>/dev/null || echo '{}')

          echo "[INFO] Merging New Relic environment variables..."
          MERGED_ENV=$(echo "$CURRENT_ENV" | jq \
            --arg nrkey "$NEW_RELIC_LICENSE_KEY" \
            --arg nracct "$NEW_RELIC_ACCOUNT_ID" \
            --arg nrhandler "$NEW_RELIC_LAMBDA_HANDLER" \
            '. + {
              "NEW_RELIC_LICENSE_KEY": $nrkey,
              "NEW_RELIC_ACCOUNT_ID": $nracct,
              "NEW_RELIC_LAMBDA_HANDLER": $nrhandler
            }')

          echo "[INFO] Updating logforwarding with New Relic layer and environment..."
          aws lambda update-function-configuration \
            --function-name logforwarding \
            --layers arn:aws:lambda:us-east-1:451483290750:layer:NewRelicLambdaExtension:40 \
            --environment "{\"Variables\": $MERGED_ENV}"
          echo "[SUCCESS] New Relic layer and environment configured for logforwarding"